name: Deploy to ECS

on:
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/**']

env:
  AWS_REGION: us-east-1
  ECR_BACKEND: ${{ secrets.ECR_BACKEND_REPO }}
  ECR_FRONTEND: ${{ secrets.ECR_FRONTEND_REPO }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: ${{ env.ECR_BACKEND }}:latest,${{ env.ECR_BACKEND }}:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          tags: ${{ env.ECR_FRONTEND }}:latest,${{ env.ECR_FRONTEND }}:${{ github.sha }}

      - name: Deploy backend to ECS
        run: |
          aws ecs update-service --cluster jvm-explorer-production \
            --service jvm-explorer-backend --force-new-deployment

      - name: Deploy frontend to ECS
        run: |
          aws ecs update-service --cluster jvm-explorer-production \
            --service jvm-explorer-frontend --force-new-deployment
