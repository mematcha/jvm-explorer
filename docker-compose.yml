services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: jvmexplorer
      POSTGRES_USER: jvmexplorer
      POSTGRES_PASSWORD: jvmexplorer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/jvmexplorer
      SPRING_DATASOURCE_USERNAME: jvmexplorer
      SPRING_DATASOURCE_PASSWORD: jvmexplorer
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
